services:
  api_gateway:
    build:
      context: ./api_gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      SERVICE_NAME: api_gateway
      PORT: ${GATEWAY_PORT}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      TEAM_SERVICE_URL: ${TEAM_SERVICE_URL}
      FINANCE_SERVICE_URL: ${FINANCE_SERVICE_URL}
      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      PRODUCT_IMPLEMENTATION_URL: ${PRODUCT_IMPLEMENTATION_URL}
      PARSERS_URL: ${PARSERS_URL}
      USER_AUTH_SERVICE_URL: ${USER_AUTH_SERVICE_URL:-http://user_auth_service:8007}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      REPORTS_DIR: /app/reports
    env_file:
      - .env
    depends_on:
      - orchestrator
      - product_service
      - team_service
      - finance_service
      - market_service
      - product_implementation
      - parsers
      - user_auth_service
    volumes:
      - market-reports-data:/app/reports 
    networks:
      - backend
    restart: unless-stopped

  orchestrator:
    build:
      context: ./orchestrator
    ports:
      - "${ORCHESTRATOR_PORT}:${ORCHESTRATOR_PORT}"
    environment:
      SERVICE_NAME: orchestrator
      PORT: ${ORCHESTRATOR_PORT}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
    env_file:
      - .env
    networks:
      - backend
    restart: unless-stopped

  product_service:
    build:
      context: ./product_service
    ports:
      - "${PRODUCT_SERVICE_PORT}:${PRODUCT_SERVICE_PORT}"
    environment:
      SERVICE_NAME: product_service
      PORT: ${PRODUCT_SERVICE_PORT}
      OLLAMA_URL: ${OLLAMA_URL}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  product_implementation:
    build:
      context: ./product_implementation
    ports:
      - "${PRODUCT_IMPLEMENTATION_PORT}:${PRODUCT_IMPLEMENTATION_PORT}"
    environment:
      SERVICE_NAME: product_implementation
      PORT: ${PRODUCT_IMPLEMENTATION_PORT}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
    env_file:
      - .env
    networks:
      - backend
    restart: unless-stopped

  team_service:
    build:
      context: ./team_service
    ports:
      - "${TEAM_SERVICE_PORT}:${TEAM_SERVICE_PORT}"
    environment:
      SERVICE_NAME: team_service
      PORT: ${TEAM_SERVICE_PORT}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
    env_file:
      - .env
    networks:
      - backend
    restart: unless-stopped

  finance_service:
    build:
      context: ./finance_service
    ports:
      - "${FINANCE_SERVICE_PORT}:${FINANCE_SERVICE_PORT}"
    environment:
      SERVICE_NAME: finance_service
      PORT: ${FINANCE_SERVICE_PORT}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
    env_file:
      - .env
    networks:
      - backend
    restart: unless-stopped

  user_auth_service:
    build:
      context: ./user_auth_service
    ports:
      - "${USER_AUTH_SERVICE_PORT:-8007}:${USER_AUTH_SERVICE_PORT:-8007}"
    environment:
      SERVICE_NAME: user_auth_service
      PORT: ${USER_AUTH_SERVICE_PORT:-8007}
      DATABASE_URL: postgresql+asyncpg://${USER_AUTH_DB_USER:-postgres}:${USER_AUTH_DB_PASSWORD:-postgres}@user-auth-db:5432/${USER_AUTH_DB_NAME:-user_auth_db}
      JWT_SECRET: ${JWT_SECRET:-change_me_please}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-user_auth_service}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
    env_file:
      - .env
    depends_on:
      user-auth-db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  user-auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${USER_AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_AUTH_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${USER_AUTH_DB_NAME:-user_auth_db}
    ports:
      - "${USER_AUTH_DB_PORT:-5433}:5432"
    volumes:
      - user-auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_AUTH_DB_USER:-postgres} -d ${USER_AUTH_DB_NAME:-user_auth_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - .env
    networks:
      - backend
    restart: unless-stopped

  market_service:
    build:
      context: ./market_service
    ports:
      - "${MARKET_SERVICE_PORT}:${MARKET_SERVICE_PORT}"
    environment:
      SERVICE_NAME: market_service
      PORT: ${MARKET_SERVICE_PORT}
      DATABASE_URL: postgresql://${MARKET_DB_USER}:${MARKET_DB_PASSWORD}@market-db:5432/${MARKET_DB_NAME}
      IDEA_PARSER_MODEL: ${IDEA_PARSER_MODEL:-qwen2.5:7b}
      IDEA_PARSER_TIMEOUT_SECONDS: ${IDEA_PARSER_TIMEOUT_SECONDS:-120}
      IDEA_PARSER_NUM_PREDICT: ${IDEA_PARSER_NUM_PREDICT:-120}
      IDEA_PARSER_NUM_CTX: ${IDEA_PARSER_NUM_CTX:-768}
      IDEA_PARSER_TEMPERATURE: ${IDEA_PARSER_TEMPERATURE:-0}
      IDEA_PARSER_KEEP_ALIVE: ${IDEA_PARSER_KEEP_ALIVE:-30m}
      IDEA_PARSER_CACHE_TTL_SECONDS: ${IDEA_PARSER_CACHE_TTL_SECONDS:-900}
      IDEA_PARSER_CACHE_MAX_SIZE: ${IDEA_PARSER_CACHE_MAX_SIZE:-512}
      JWT_SECRET: ${JWT_SECRET:-change_me_please}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-user_auth_service}
      REPORTS_STORAGE_DIR: ${REPORTS_STORAGE_DIR:-/tmp/reports}
      REPORTS_PUBLIC_BASE_PATH: ${REPORTS_PUBLIC_BASE_PATH:-/reports/files}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
    env_file:
      - .env
    volumes:
      - market-reports-data:/tmp/reports
    depends_on:
      market-db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  market-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${MARKET_DB_USER}
      POSTGRES_PASSWORD: ${MARKET_DB_PASSWORD}
      POSTGRES_DB: ${MARKET_DB_NAME}
    ports:
      - "${MARKET_DB_PORT}:5432"
    volumes:
      - market-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARKET_DB_USER} -d ${MARKET_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    env_file:
      - .env
    networks:
      - backend
    restart: unless-stopped

  parsers:
    build:
      context: ./parsers
    ports:
      - "${PARSERS_PORT}:${PARSERS_PORT}"
    environment:
      SERVICE_NAME: parsers
      PORT: ${PARSERS_PORT}
      MARKET_SERVICE_URL: ${MARKET_SERVICE_URL}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
    env_file:
      - .env
    depends_on:
      - market_service
    networks:
      - backend
    restart: unless-stopped

  ollama:
    build:
      context: ./ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: glasdaq_frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
    env_file:
      - .env
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  market-db-data:
  user-auth-db-data:
  ollama-data:
  market-reports-data:
